# Render Blueprint: Dashboard → New → Blueprint → pick this repository and branch.
services:
  - type: web
    name: poliglot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: poliglot-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: AUTH_COOKIE_SECURE
        value: "1"
      # Render's proxy adds one X-Forwarded-For entry: the learner's address for the login lockout.
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: TIME_ZONE
        value: Asia/Almaty
      # AI chat: enter the key in the dashboard. Without it an offline tutor answers.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: claude-opus-5
      - key: CHAT_EFFORT
        value: low
      - key: CHAT_DAILY_LIMIT
        value: "30"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "1"
      - fromGroup: poliglot-mail

  # Daily reminder emails ("you have not studied today"): checks every hour who is due at their chosen hour.
  # Render cron jobs are billed by run time (a few seconds an hour); delete this service to turn reminders off.
  - type: cron
    name: poliglot-reminders
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    schedule: "5 * * * *"
    dockerCommand: python manage.py send_reminders
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: poliglot-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: poliglot
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_DEBUG
        value: "0"
      - key: TIME_ZONE
        value: Asia/Almaty
      # The address used in the email links: the web service's public URL.
      - key: FRONTEND_URL
        sync: false
      - fromGroup: poliglot-mail

envVarGroups:
  # Email for registration codes, password resets and reminders. Without SMTP they only appear in the logs,
  # so nobody can confirm an account — fill these in (e.g. Resend, Mailgun, Gmail app password).
  - name: poliglot-mail
    envVars:
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "1"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

databases:
  - name: poliglot-db
    plan: free
    region: frankfurt
    databaseName: poliglot
    user: poliglot
