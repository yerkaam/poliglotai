name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: poliglot
          POSTGRES_USER: poliglot
          POSTGRES_PASSWORD: poliglot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poliglot" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production
      - run: npx ng test --watch=false --browsers=ChromeHeadless

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      # The fixed test code only works with DEBUG, so the Docker stack skips email confirmation here;
      # backend tests and local e2e (EMAIL_CODE_OVERRIDE) cover it.
      - run: cp .env.example .env && echo "REQUIRE_EMAIL_VERIFICATION=0" >> .env
      - run: docker compose up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: frontend
        run: E2E_BASE_URL=http://localhost:8080 E2E_MANAGE="docker compose -f ../docker-compose.yml exec -T backend python manage.py" npx playwright test
      - if: failure()
        run: docker compose logs backend
